<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf | Your Ticket</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ticket.js" defer></script>
</head>
<body class="ticket-page">
    

    <main class="ticket-main">
        

        <section class="ticket" aria-label="Your Coding Conf ticket">
            <div class="ticket-top">
                <div class="logo ticket-logo"><span class="logo-mark">⌘</span> Coding Conf</div>
                <span class="ticket-label">ATTENDEE PASS</span>
            </div>
            <p class="ticket-date">October 26, 2026 <span>·</span> Papine, Kgn</p>
            <div class="ticket-person">
                <img id="ticket-avatar" src="../assets/avatar-placeholder.svg" alt="Your uploaded profile avatar">
                <div>
                    <h2 id="ticket-name">Your Name</h2>
                    <a id="ticket-github" href="https://github.com/" target="_blank" rel="noopener noreferrer">@github</a>
                </div>
            </div>
            <div class="ticket-bottom">
                <span>CODING CONF · 2026</span>
                <strong id="ticket-number">#01609</strong>
            </div>
        </section>

        <div class="ticket-actions">
            <a class="button button-secondary" href="index.html">Back to Home</a>
            <button class="button" type="button" onclick="window.print()">Print Ticket</button>
        </div>
    </main>

</body>
</html>
