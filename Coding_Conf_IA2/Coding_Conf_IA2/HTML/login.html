<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf | Registration</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/validation.js" defer></script>
</head>
<body class="form-page">

    <main class=>
    
<br>
<br>
        <section class="form-card" aria-labelledby="form-title">
            <h2 id="form-title">Registration details</h2>
            <p class="muted">All fields are required.</p>
            <form id="registration-form" novalidate>
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="e.g. Jordan Brown">
                    <small class="error" id="name-error"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
                    <small class="error" id="email-error"></small>
                </div>
                <div class="form-group">
                    <label for="github">GitHub username</label>
                    <input type="text" id="github" name="github" placeholder="@yourusername">
                    <small class="help-text">Enter your username with the @ symbol.</small>
                    <small class="error" id="github-error"></small>
                </div>
                <div class="form-group">
                    <label for="avatar">Upload avatar (JPEG or PNG, under 500 KB)</label>
                    <input type="file" id="avatar" name="avatar" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                    <small class="error" id="avatar-error"></small>
                </div>
                <button class="button button-full" type="submit">Generate My Ticket <span aria-hidden="true">→</span></button>
                <p class="privacy-note">This demonstration stores your registration in this browser only.</p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <a class="logo" href="index.html"><span class="logo-mark">⌘</span> Coding Conf</a>
        <p>Learn together. Build together.</p>
    </footer>
</body>
</html>
